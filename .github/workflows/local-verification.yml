name: Isolated Linux verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No environments, secrets, registry login, deployment, privileged PR event or write token.
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql+psycopg://synthetic@127.0.0.1:1/primary_sentinel
      TEST_DATABASE_URL: postgresql+psycopg://synthetic@127.0.0.1:2/test_sentinel
      JWT_SECRET_KEY: synthetic-ci-key-never-used-outside-ephemeral-tests
      GROQ_API_KEY: ''
      EMAIL_MODE: disabled
      ACCOUNT_DELETION_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Initialize owned loopback PostgreSQL 16 cluster
        shell: bash
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          if [ ! -x "$pg_bin/initdb" ]; then
            sudo apt-get update -y
            sudo apt-get install -y postgresql-16 postgresql-client-16
          fi
          test -x "$pg_bin/initdb"
          mkdir -p "$GITHUB_WORKSPACE/tmp/database-readiness"
          "$pg_bin/initdb" -D "$GITHUB_WORKSPACE/tmp/database-readiness/cluster" -U nafsiy_readiness -A trust --encoding=UTF8 --locale=C.UTF-8
          "$pg_bin/pg_ctl" start -D "$GITHUB_WORKSPACE/tmp/database-readiness/cluster" -l "$GITHUB_WORKSPACE/tmp/database-readiness/server.log" -o "-h 127.0.0.1 -p 55496 -k /tmp"
          "$pg_bin/pg_isready" -h 127.0.0.1 -p 55496
          echo "NAFSIY_LOCAL_PG_ADMIN_URL=postgresql+psycopg://nafsiy_readiness@127.0.0.1:55496/postgres" >> "$GITHUB_ENV"
          echo "NAFSIY_LOCAL_PG_DATA=$GITHUB_WORKSPACE/tmp/database-readiness/cluster" >> "$GITHUB_ENV"
          echo "NAFSIY_TEST_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
      - name: Full backend suite - no skipped integration tests
        run: python tools/run_isolated_regression.py
      - name: Validate Render configuration (read-only)
        run: python tools/validate_deployment.py
      - name: Frontend lint and same-origin production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ''
          APP_ENV: development
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Local TLS integration, Secure cookies, CSRF and synthetic load
        run: python tools/run_local_staging_checks.py
      - name: Build backend and frontend images - no registry push
        run: |
          docker build --tag nafsiy-backend:ci --file Dockerfile.backend .
          docker build --tag nafsiy-frontend:ci --file frontend/Dockerfile .
      - name: Default image startup, non-root, health and idle shutdown
        run: python tools/docker_smoke.py
      - name: Upload only aggregate results (never logs, dumps or env files)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-verification-results
          path: |
            evaluations/backend_regression_results.json
            evaluations/local_staging_results.json
            evaluations/docker_smoke_results.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop owned local PostgreSQL cluster
        if: always()
        shell: bash
        run: |
          if test -f "$GITHUB_WORKSPACE/tmp/database-readiness/cluster/postmaster.pid"; then
            /usr/lib/postgresql/16/bin/pg_ctl stop -D "$GITHUB_WORKSPACE/tmp/database-readiness/cluster" -m fast
          fi

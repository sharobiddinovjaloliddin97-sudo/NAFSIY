services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nafsiy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: nafsiy_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nafsiy -d nafsiy_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
